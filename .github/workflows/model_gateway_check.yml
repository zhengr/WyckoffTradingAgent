name: Model gateway check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe taoktao OpenAI-compatible chat
        env:
          API_KEY: ${{ secrets.TDX_TEST_MODEL_KEY }}
        run: |
          echo "--- /v1/models ---"
          curl -sS --max-time 30 -H "Authorization: Bearer $API_KEY" https://api.taoktao.com/v1/models -o /tmp/models.json -w 'status=%{http_code}\n'
          head -c 300 /tmp/models.json; echo
          echo "--- /v1/chat/completions ---"
          curl -sS --max-time 60 -H "Authorization: Bearer $API_KEY" -H 'Content-Type: application/json' \
            -d '{"model":"mixtao","messages":[{"role":"user","content":"reply OK"}],"max_tokens":10}' \
            https://api.taoktao.com/v1/chat/completions -o /tmp/chat.json -w 'status=%{http_code}\n'
          head -c 400 /tmp/chat.json; echo
