name: Verify all fixes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify BSE / US / quote
        run: |
          W=https://wyckoff-api.zhengr.workers.dev
          echo "--- BSE 920029 ---"
          curl -sS --max-time 30 "$W/api/kline?code=920029&start=20261110&end=20261118" -o /tmp/b.json -w 'status=%{http_code}\n'
          python3 -c "import json; d=json.load(open('/tmp/b.json')); print('source:', d.get('source'), 'rows:', len(d.get('data',[])), 'last:', d['data'][-1] if d.get('data') else None)"
          echo "--- US AAPL.US ---"
          curl -sS --max-time 30 "$W/api/kline?code=AAPL.US&start=20261110&end=20261118&adjust=qfq" -o /tmp/u.json -w 'status=%{http_code}\n'
          python3 -c "import json; d=json.load(open('/tmp/u.json')); print('source:', d.get('source'), 'rows:', len(d.get('data',[])), 'last:', d['data'][-1] if d.get('data') else None)"
          echo "--- quote 600519 (code param) ---"
          curl -sS --max-time 30 "$W/api/quote?code=600519" -o /tmp/q.json -w 'status=%{http_code}\n'
          head -c 250 /tmp/q.json; echo
          echo "--- quote BSE 920029 ---"
          curl -sS --max-time 30 "$W/api/quote?code=920029" -o /tmp/q2.json -w 'status=%{http_code}\n'
          head -c 250 /tmp/q2.json; echo
          echo "--- HK still ok ---"
          curl -sS --max-time 30 "$W/api/kline?code=00700.HK&start=20261110&end=20261118" -o /tmp/h.json -w 'status=%{http_code}\n'
          python3 -c "import json; d=json.load(open('/tmp/h.json')); print('source:', d.get('source'), 'rows:', len(d.get('data',[])))"
