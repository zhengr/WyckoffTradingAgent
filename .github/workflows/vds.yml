name: Verify CI data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests pandas -q
      - name: test sources
        run: |
          python3 - <<'EOF'
          import requests
          h = {"User-Agent": "Mozilla/5.0", "Referer": "https://gu.qq.com/"}
          # 腾讯 A 股前复权日线
          r = requests.get("https://web.ifzq.gtimg.cn/appstock/app/fqkline/get",
                           params={"param": "sh600519,day,,,30,qfq"}, headers=h, timeout=15)
          print("tencent sh600519:", r.status_code, r.text[:120])
          # 腾讯 BSE
          r2 = requests.get("https://web.ifzq.gtimg.cn/appstock/app/fqkline/get",
                            params={"param": "bj920029,day,,,30,qfq"}, headers=h, timeout=15)
          print("tencent bj920029:", r2.status_code, r2.text[:120])
          # 腾讯 quote 批量
          r3 = requests.get("https://qt.gtimg.cn/q=sh600519,bj920029", headers=h, timeout=15)
          print("tencent quote:", r3.status_code, r3.text[:150])
          # tdx 盘后包
          import datetime
          d = (datetime.date.today() - datetime.timedelta(days=1)).strftime("%Y%m%d")
          r4 = requests.get(f"https://www.tdx.com.cn/products/data/data/g4day/{d}.zip", timeout=30)
          print("tdx g4day", d, ":", r4.status_code, len(r4.content), "bytes")
          EOF
