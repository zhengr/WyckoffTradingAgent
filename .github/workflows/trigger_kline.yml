name: trigger kline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -sS --max-time 30 "https://wyckoff-api.zhengr.workers.dev/api/kline?code=920029&start=20261117&end=20261118" -o /dev/null -w "attempt$i=%{http_code}\n"
            sleep 2
          done
