name: final admin check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: check
        run: |
          B=https://wyckoff-analysis-dyj.pages.dev
          W=https://wyckoff-api.zhengr.workers.dev
          echo "ADMIN_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 $B/admin)"
          echo "ADMIN_API_NOAUTH=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 $W/api/admin/users)"
          echo "LOGIN_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 $B/login)"
