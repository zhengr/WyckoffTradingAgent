name: Probe US from worker-like env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "--- sina US daily k ---"
          curl -sS --max-time 20 -H 'User-Agent: Mozilla/5.0' "https://stock.finance.sina.com.cn/usstock/api/jsonp.php/x/US_MinKService.getDailyK?symbol=aapl" | head -c 250; echo
          echo "--- sina US json ---"
          curl -sS --max-time 20 -H 'User-Agent: Mozilla/5.0' "https://stock.finance.sina.com.cn/usstock/api/json_v2.php/US_MinKService.getDailyK?symbol=aapl" | head -c 250; echo
          echo "--- futu ---"
          curl -sS --max-time 20 -H 'User-Agent: Mozilla/5.0' "https://www.futunn.com/quote-api/quote-open-api/get-k-line?stock_id=105.AAPL&period=day&count=20" | head -c 250; echo
          echo "--- xueqiu ---"
          curl -sS --max-time 20 -H 'User-Agent: Mozilla/5.0' "https://stock.xueqiu.com/v5/stock/chart/kline.json?symbol=AAPL&period=day&count=20" | head -c 250; echo
          echo "--- tencent us with referer ---"
          curl -sS --max-time 20 -H 'User-Agent: Mozilla/5.0' -H 'Referer: https://gu.qq.com/' "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=usAAPL,day,,,30,qfq" | head -c 250; echo
