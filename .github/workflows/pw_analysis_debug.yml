name: PW analysis debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup playwright
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm i playwright@1.49.0 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Login and open analysis
        env:
          EMAIL: ${{ secrets.PWTEST_EMAIL }}
          PASS: ${{ secrets.PWTEST_PASS }}
        run: |
          cat > /tmp/pw/debug.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const logs = [];
          const netfail = [];
          page.on('console', (m) => { if (m.type()==='error'||m.type()==='warning') logs.push(m.type()+': '+m.text().slice(0,300)) });
          page.on('pageerror', (e) => logs.push('PAGEERROR: '+e.message.slice(0,300)));
          page.on('requestfailed', (r) => netfail.push(r.url().slice(0,150)+' :: '+(r.failure()?.errorText||'')));
          const BASE = 'https://wyckoff-analysis-dyj.pages.dev';
          try {
            await page.goto(BASE+'/login', { waitUntil:'networkidle', timeout:45000 });
            await page.fill('input[type=email]', process.env.EMAIL);
            await page.fill('input[type=password]', process.env.PASS);
            await Promise.all([
              page.waitForURL('**/analysis**', {timeout:15000}).catch(()=>{}),
              page.getByRole('button', {name:/登录|login/i}).first().click(),
            ]);
            await page.waitForTimeout(3000);
            console.log('AFTER_LOGIN_URL:', page.url());
            // 导航到单股分析
            await page.goto(BASE+'/analysis', { waitUntil:'domcontentloaded', timeout:45000 });
            await page.waitForTimeout(1500);
            // 找输入框输入代码
            const inputs = await page.locator('input').count();
            console.log('INPUT_COUNT:', inputs);
            const body0 = (await page.evaluate(()=>document.body.innerText)).slice(0,300);
            console.log('BODY_BEFORE:', JSON.stringify(body0));
            // 尝试常见输入框
            const codeInput = page.locator('input').first();
            if (await codeInput.count()) {
              await codeInput.fill('600519');
              await codeInput.press('Enter');
              await page.waitForTimeout(12000);
            }
            const body = (await page.evaluate(()=>document.body.innerText)).slice(0,2000);
            console.log('BODY_AFTER:', JSON.stringify(body));
          } catch(e) { console.log('SCRIPT_ERROR:', e.message.slice(0,300)) }
          console.log('=== CONSOLE LOGS ===');
          logs.slice(0,20).forEach(l=>console.log(l));
          console.log('=== NET FAILURES ===');
          netfail.slice(0,20).forEach(l=>console.log(l));
          await browser.close();
          EOF
          node /tmp/pw/debug.mjs
