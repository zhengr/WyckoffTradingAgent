name: Pages bundle verify2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check taoktao in Pages bundle
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          HTML=$(curl -sS --max-time 20 "$BASE/")
          ASSET=$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.js' | head -1)
          curl -sS --max-time 30 "$BASE$ASSET" -o /tmp/main.js
          echo "asset: $ASSET size: $(wc -c < /tmp/main.js)"
          grep -c 'api.taoktao.com' /tmp/main.js && echo TAOKTAO_PRESENT || echo TAOKTAO_MISSING
