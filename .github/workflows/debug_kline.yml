name: Debug kline failures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Direct upstream tests
        run: |
          echo "=== tencent US fqkline usAAPL ==="
          curl -sS --max-time 20 "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=usAAPL,day,2026-11-10,2026-11-18,30,qfq" -H 'User-Agent: Mozilla/5.0' | head -c 300; echo
          echo "=== tencent BJ bj920029 ==="
          curl -sS --max-time 20 "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=bj920029,day,2026-11-10,2026-11-18,30,qfq" -H 'User-Agent: Mozilla/5.0' | head -c 200; echo
          echo "=== tencent BJ kline ==="
          curl -sS --max-time 20 "https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=bj920029,day,2026-11-10,2026-11-18,30" -H 'User-Agent: Mozilla/5.0' | head -c 200; echo
          echo "=== sina BJ ==="
          curl -sS --max-time 20 "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData?symbol=bj920029&scale=240&ma=no&datalen=30" -H 'User-Agent: Mozilla/5.0' | head -c 200; echo
          echo "=== worker /api/kline verbose US ==="
          curl -sS --max-time 30 "https://wyckoff-api.zhengr.workers.dev/api/kline?code=AAPL.US&start=20261110&end=20261118" | head -c 300; echo
          echo "=== worker /api/kline verbose BJ ==="
          curl -sS --max-time 30 "https://wyckoff-api.zhengr.workers.dev/api/kline?code=920029&start=20261110&end=20261118" | head -c 300; echo
          echo "=== worker /api/quote verbose ==="
          curl -sS --max-time 30 "https://wyckoff-api.zhengr.workers.dev/api/quote?code=600519" | head -c 300; echo
