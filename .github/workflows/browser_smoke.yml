name: Browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install playwright
        run: npm i -g playwright@1.49.0 && playwright install --with-deps chromium
      - name: Visit page and dump console
        run: |
          cat > /tmp/check.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [];
          page.on('console', (m) => { if (m.type() === 'error') errors.push(m.text()) });
          page.on('pageerror', (e) => errors.push('PAGEERROR: ' + e.message));
          await page.goto('https://wyckoff-analysis-dyj.pages.dev/', { waitUntil: 'networkidle', timeout: 45000 });
          await page.waitForTimeout(3000);
          const rootHtml = await page.evaluate(() => document.getElementById('root')?.innerHTML.length || 0);
          const title = await page.title();
          const bodyText = (await page.evaluate(() => document.body.innerText)).slice(0, 200);
          console.log(JSON.stringify({ title, rootHtmlLength: rootHtml, bodyText, errors }, null, 2));
          await browser.close();
          EOF
          node /tmp/check.mjs
          echo "--- /login ---"
          cat > /tmp/check2.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [];
          page.on('console', (m) => { if (m.type() === 'error') errors.push(m.text()) });
          page.on('pageerror', (e) => errors.push('PAGEERROR: ' + e.message));
          await page.goto('https://wyckoff-analysis-dyj.pages.dev/login', { waitUntil: 'networkidle', timeout: 45000 });
          await page.waitForTimeout(2000);
          const rootHtml = await page.evaluate(() => document.getElementById('root')?.innerHTML.length || 0);
          console.log(JSON.stringify({ rootHtmlLength: rootHtml, errors }, null, 2));
          await browser.close();
          EOF
          node /tmp/check2.mjs
