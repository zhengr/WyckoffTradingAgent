name: Browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install playwright and run checks
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm i playwright@1.49.0 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > /tmp/pw/check.mjs << 'EOF'
          import { chromium } from 'playwright';
          async function probe(url) {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('console', (m) => { if (m.type() === 'error') errors.push(m.text().slice(0, 300)) });
            page.on('pageerror', (e) => errors.push('PAGEERROR: ' + e.message.slice(0, 300)));
            let status = 'ok';
            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
            } catch (e) { status = 'nav-failed: ' + e.message.slice(0, 200) }
            await page.waitForTimeout(3000);
            const out = await page.evaluate(() => ({
              title: document.title,
              rootLen: document.getElementById('root')?.innerHTML.length || 0,
              text: document.body.innerText.slice(0, 300),
            }));
            await browser.close();
            return { url, status, ...out, errors };
          }
          console.log(JSON.stringify(await probe('https://wyckoff-analysis-dyj.pages.dev/'), null, 2));
          console.log(JSON.stringify(await probe('https://wyckoff-analysis-dyj.pages.dev/login'), null, 2));
          EOF
          node /tmp/pw/check.mjs
