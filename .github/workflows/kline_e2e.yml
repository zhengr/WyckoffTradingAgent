name: Kline API e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/kline via Pages
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          echo "--- valid 600519 ---"
          curl -sS --max-time 30 "$BASE/api/kline?code=600519&start=20261110&end=20261118&adjust=qfq" -o /tmp/k.json -w 'status=%{http_code}\n'
          python3 -c "
          import json
          d = json.load(open('/tmp/k.json'))
          print('source:', d.get('source'), '| rows:', len(d.get('data', [])))
          last = d['data'][-1]
          print('last:', last)
          "
          echo "--- bad code (expect 400) ---"
          curl -sS --max-time 15 -o /dev/null -w 'status=%{http_code}\n' "$BASE/api/kline?code=abc&start=20261101&end=20261118"
          echo "--- hk 00700 ---"
          curl -sS --max-time 30 "$BASE/api/kline?code=00700&start=20261110&end=20261118" -o /tmp/hk.json -w 'status=%{http_code}\n'
          python3 -c "
          import json
          d = json.load(open('/tmp/hk.json'))
          print('source:', d.get('source'), '| rows:', len(d.get('data', [])), '| last close:', d['data'][-1]['close'] if d.get('data') else None)
          "
