name: Check locale fix in bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bundle for locale guard
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          HTML=$(curl -sS --max-time 20 "$BASE/")
          ASSET=$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.js' | head -1)
          curl -sS --max-time 30 "$BASE$ASSET" -o /tmp/main.js
          echo "main.js size: $(wc -c < /tmp/main.js)"
          echo "tickflow count: $(grep -c -i tickflow /tmp/main.js)"
          echo "Incorrect locale guard (catch fallback): $(grep -c 'Incorrect locale' /tmp/main.js)"
          # 找所有 Intl 调用
          grep -oE 'Intl\.[A-Za-z]+' /tmp/main.js | sort | uniq -c
