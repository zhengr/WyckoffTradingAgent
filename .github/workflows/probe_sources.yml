name: Probe HK US minute sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install akshare
        run: pip install -q akshare==1.18.64
      - name: Probe sources
        run: |
          python - << 'EOF'
          import akshare as ak
          import requests
          checks = [
            ("ak_hk_hist", lambda: ak.stock_hk_hist(symbol="00700", period="daily", start_date="20261101", end_date="20261118", adjust="qfq")),
            ("ak_us_hist", lambda: ak.stock_us_hist(symbol="105.AAPL", period="daily", start_date="20261101", end_date="20261118", adjust="qfq")),
            ("ak_a_min5", lambda: ak.stock_zh_a_hist_min_em(symbol="600519", period="5", start_date="2026-11-18 09:30:00", end_date="2026-11-18 15:00:00", adjust="qfq")),
            ("ak_hk_spot", lambda: ak.stock_hk_spot_em()),
            ("ak_us_spot", lambda: ak.stock_us_spot_em()),
          ]
          for name, fn in checks:
            try:
              df = fn(); print(f"{name}: OK rows={len(df)} cols={list(df.columns)[:5]}")
            except Exception as e:
              print(f"{name}: FAIL {type(e).__name__}: {str(e)[:80]}")
          # 腾讯分钟线 + 港股日线（HTTP 直连）
          for name, url in [
            ("tx_min5", "https://web.ifzq.gtimg.cn/appstock/app/kline/mkline?param=sh600519,m5,,50"),
            ("tx_hk", "https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=hk00700,day,2026-11-01,2026-11-18,20"),
            ("tx_us", "https://web.ifzq.gtimg.cn/appstock/app/us/kline?param=usAAPL,day,,,20"),
          ]:
            try:
              r = requests.get(url, timeout=15, headers={'User-Agent':'Mozilla/5.0'})
              print(f"{name}: HTTP {r.status_code} {r.text[:120]}")
            except Exception as e:
              print(f"{name}: FAIL {type(e).__name__}: {str(e)[:80]}")
          EOF
