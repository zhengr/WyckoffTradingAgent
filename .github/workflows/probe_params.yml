name: Probe params

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          for u in \
            "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=usAAPL,day,,,20,qfq" \
            "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=usAAPL,day,,,20" \
            "https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=usAAPL,day,,,20" \
            "https://web.ifzq.gtimg.cn/appstock/app/usfqkline/get?param=usAAPL,day,,,20,qfq" \
            "https://web.ifzq.gtimg.cn/appstock/app/us/kline?param=usAAPL,day,,,20" ; do
            echo "URL: ${u##*param=}"
            curl -sS --max-time 20 "$u" -H 'User-Agent: Mozilla/5.0' | head -c 200; echo
          done
          echo "--- THS day count variants ---"
          for t in "2026.js" "20261118.js" "last320.js"; do
            echo "tail=$t"
            curl -sS --max-time 20 "https://d.10jqka.com.cn/v6/line/hs_920029/01/$t" -H 'User-Agent: Mozilla/5.0' | head -c 120; echo
          done
