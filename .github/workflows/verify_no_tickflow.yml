name: Verify no-tickflow web

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup playwright
        run: mkdir -p /tmp/pwv && cd /tmp/pwv && npm init -y > /dev/null && npm i playwright@1.49.0 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Verify pages
        env:
          EMAIL: ${{ secrets.VFY_EMAIL }}
          PASS: ${{ secrets.VFY_PASS }}
        run: |
          cat > /tmp/pwv/v.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errs = [];
          page.on('pageerror', (e) => errs.push('PAGEERROR: '+e.message.slice(0,200)));
          const BASE = 'https://wyckoff-analysis-dyj.pages.dev';
          try {
            await page.goto(BASE+'/login', {waitUntil:'networkidle', timeout:45000});
            await page.fill('input[type=email]', process.env.EMAIL);
            await page.fill('input[type=password]', process.env.PASS);
            await Promise.all([
              page.waitForURL('**/chat', {timeout:15000}).catch(()=>{}),
              page.getByRole('button', {name:/登录|login/i}).first().click(),
            ]);
            await page.waitForTimeout(2000);
            // 单股分析
            await page.goto(BASE+'/analysis', {waitUntil:'domcontentloaded', timeout:45000});
            await page.waitForTimeout(1500);
            await page.locator('input').first().fill('600519');
            await page.locator('input').first().press('Enter');
            await page.waitForTimeout(14000);
            const body = (await page.evaluate(()=>document.body.innerText)).slice(0,2500);
            console.log('ANALYSIS_BODY:', JSON.stringify(body));
            // 设置页看 Tushare
            await page.goto(BASE+'/settings', {waitUntil:'domcontentloaded', timeout:45000});
            await page.waitForTimeout(2500);
            const sbody = (await page.evaluate(()=>document.body.innerText)).slice(0,1800);
            console.log('SETTINGS_BODY:', JSON.stringify(sbody));
          } catch(e) { console.log('SCRIPT_ERROR:', e.message.slice(0,300)) }
          console.log('=== PAGE ERRORS ===');
          errs.slice(0,10).forEach(e=>console.log(e));
          await browser.close();
          EOF
          node /tmp/pwv/v.mjs
