name: probe yahoo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: yahoo
        run: |
          echo "--- yahoo chart ---"
          curl -sS --max-time 20 -H 'User-Agent: Mozilla/5.0' "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?period1=1730000000&period2=1764000000&interval=1d&events=history" | head -c 300; echo
          echo "--- stooq ---"
          curl -sS --max-time 20 "https://stooq.com/q/d/l/?s=aapl.us&d1=20261110&d2=20261118&i=d" | head -c 300; echo
