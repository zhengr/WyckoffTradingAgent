name: Verify agent analyze BSE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup playwright
        run: mkdir -p /tmp/pa && cd /tmp/pa && npm init -y > /dev/null && npm i playwright@1.49.0 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Chat analyze BSE
        env:
          EMAIL: ${{ secrets.AG_EMAIL }}
          PASS: ${{ secrets.AG_PASS }}
        run: |
          cat > /tmp/pa/a.mjs << 'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const BASE = 'https://wyckoff-analysis-dyj.pages.dev';
          await page.goto(BASE+'/login', {waitUntil:'networkidle', timeout:45000});
          await page.fill('input[type=email]', process.env.EMAIL);
          await page.fill('input[type=password]', process.env.PASS);
          await Promise.all([
            page.waitForURL('**/chat', {timeout:15000}).catch(()=>{}),
            page.getByRole('button', {name:/登录|login/i}).first().click(),
          ]);
          await page.waitForTimeout(2500);
          // 找聊天输入框
          const ta = page.locator('textarea').first();
          if (await ta.count()) {
            await ta.fill('帮我分析北交所股票 920029 开发科技，用分析工具看一下K线结构');
            await ta.press('Enter');
          } else {
            const inp = page.locator('input[type=text]').last();
            await inp.fill('帮我分析北交所股票 920029 开发科技');
            await inp.press('Enter');
          }
          await page.waitForTimeout(25000);
          const body = (await page.evaluate(()=>document.body.innerText)).slice(-3000);
          console.log('CHAT_BODY:', JSON.stringify(body));
          await browser.close();
          EOF
          node /tmp/pa/a.mjs
