name: Probe CI bse burst

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests -q
      - name: probe
        run: |
          python3 - <<'EOF'
          import requests, time
          h = {"User-Agent": "Mozilla/5.0", "Referer": "https://quote.eastmoney.com/"}
          hs = {"User-Agent": "Mozilla/5.0", "Referer": "https://finance.sina.com.cn/"}
          # 1) sina kline bj
          r = requests.get("https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData",
              params={"symbol": "bj920029", "scale": "240", "ma": "no", "datalen": "30"}, headers=hs, timeout=15)
          print("sina kline bj920029:", r.status_code, r.text[:120])
          # 2) push2his burst 40 sequential
          ok = fail = 0
          for i in range(40):
              try:
                  r = requests.get("https://push2his.eastmoney.com/api/qt/stock/kline/get",
                      params={"secid": f"0.9200{(i%30):02d}", "fields1": "f1,f2,f3,f4,f5,f6",
                              "fields2": "f51,f52,f53,f54,f55,f56,f57,f58", "klt": "101", "fqt": "1",
                              "beg": "20260101", "end": "20261127"}, headers=h, timeout=10)
                  d = r.json()
                  if r.status_code == 200 and d.get("rc") == 0 and (d.get("data") or {}).get("klines"):
                      ok += 1
                  else:
                      fail += 1
                      if fail <= 3: print("fail at", i, r.status_code, r.text[:100])
              except Exception as e:
                  fail += 1
                  if fail <= 3: print("exc at", i, repr(e)[:100])
              time.sleep(0.2)
          print(f"push2his burst: ok={ok} fail={fail}")
          EOF
