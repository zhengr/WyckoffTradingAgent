name: Verify proxy origin fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test llm-proxy with our pages origin + kline fallback
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          ORIGIN="$BASE"
          echo "--- llm-proxy tushare with our origin (expect non-403) ---"
          curl -sS --max-time 30 -o /tmp/t.json -w 'status=%{http_code}\n' -X POST "$BASE/api/llm-proxy/" \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -H 'X-Target-URL: https://api.tushare.pro' \
            -d '{"api_name":"daily","token":"bad","params":{"ts_code":"600519.SH"},"fields":"trade_date"}'
          head -c 150 /tmp/t.json; echo
          echo "--- llm-proxy tickflow with our origin ---"
          curl -sS --max-time 30 -o /tmp/tk.json -w 'status=%{http_code}\n' -X GET "$BASE/api/llm-proxy/v1/klines?symbol=sh600519&period=1d&count=5" \
            -H "Origin: $ORIGIN" -H 'x-api-key: bad' -H 'X-Target-URL: https://api.tickflow.org'
          head -c 150 /tmp/tk.json; echo
          echo "--- /api/kline still ok ---"
          curl -sS --max-time 30 -H "Origin: $ORIGIN" "$BASE/api/kline?code=600519&start=20261116&end=20261118" -o /tmp/k.json -w 'status=%{http_code}\n'
          head -c 200 /tmp/k.json; echo
          echo "--- evil origin still blocked ---"
          curl -sS --max-time 15 -o /dev/null -w 'status=%{http_code}\n' "$BASE/api/llm-proxy/" -H 'Origin: https://evil.example.com' -H 'X-Target-URL: https://api.tushare.pro'
