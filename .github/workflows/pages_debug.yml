name: Pages debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages content
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          echo "=== / headers ==="
          curl -sSI --max-time 20 "$BASE/" | head -12
          echo "=== / body (first 400 chars) ==="
          curl -sS --max-time 20 "$BASE/" | head -c 400; echo
          echo "=== /chat body (first 400 chars) ==="
          curl -sS --max-time 20 "$BASE/chat" | head -c 400; echo
          echo "=== assets probe ==="
          HTML=$(curl -sS --max-time 20 "$BASE/")
          ASSET=$(echo "$HTML" | grep -oE '/assets/[^"]+\.js' | head -1)
          echo "first js asset: $ASSET"
          if [[ -n "$ASSET" ]]; then
            curl -sS -o /dev/null -w 'asset status: %{http_code} size: %{size_download}\n' --max-time 20 "$BASE$ASSET"
          fi
          echo "=== _headers file content ==="
          curl -sS --max-time 20 "$BASE/" -D - -o /dev/null | grep -iE 'content-security|x-frame|x-content' || echo "(no security headers)"
