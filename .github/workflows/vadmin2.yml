name: Verify admin2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: precise
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          echo "RESULT_ADMIN_HTML=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 $BASE/admin)"
          echo "RESULT_LOGIN_HTML=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 $BASE/login)"
          # 检查主 JS 是否引用 admin chunk
          HTML=$(curl -sS --max-time 20 $BASE/)
          ASSET=$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.js' | head -1)
          echo "MAIN_ASSET=$ASSET"
          curl -sS --max-time 30 "$BASE$ASSET" -o /tmp/main.js
          echo "ADMIN_ROUTE_REF=$(grep -o '"/admin"' /tmp/main.js | wc -l)"
          echo "ADMIN_CHUNK=$(grep -oE 'admin-[A-Za-z0-9_-]+\.js' /tmp/main.js | head -1)"
