name: Check frontend bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest frontend bundle and grep for fallback
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          HTML=$(curl -sS --max-time 20 "$BASE/")
          echo "index html cache-control:"; curl -sSI --max-time 20 "$BASE/" | grep -i cache-control
          ASSET=$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.js' | head -1)
          echo "asset: $ASSET"
          curl -sS --max-time 30 "$BASE$ASSET" -o /tmp/main.js
          echo "size: $(wc -c < /tmp/main.js)"
          echo "has /api/kline: $(grep -c '/api/kline' /tmp/main.js)"
          echo "has fetchKlineViaServerApi: $(grep -c 'fetchKlineViaServerApi' /tmp/main.js)"
          echo "has tencent label: $(grep -c '腾讯' /tmp/main.js)"
          # 也抓 analysis chunk
          A2=$(echo "$HTML" | grep -oE '/assets/[^"]+\.js' | head -20)
          for a in $A2; do
            curl -sS --max-time 30 "$BASE$a" -o /tmp/x.js 2>/dev/null
            if grep -q '/api/kline' /tmp/x.js 2>/dev/null; then echo "FOUND /api/kline in $a"; fi
          done
