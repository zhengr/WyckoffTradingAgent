name: Verify CI bse sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests -q
      - name: test
        run: |
          python3 - <<'EOF'
          import requests
          h = {"User-Agent": "Mozilla/5.0", "Referer": "https://quote.eastmoney.com/"}
          # eastmoney push2his BSE 前复权日线
          r = requests.get("https://push2his.eastmoney.com/api/qt/stock/kline/get",
              params={"secid": "0.920029", "fields1": "f1,f2,f3,f4,f5,f6",
                      "fields2": "f51,f52,f53,f54,f55,f56,f57,f58",
                      "klt": "101", "fqt": "1", "beg": "20260101", "end": "20261127"},
              headers=h, timeout=15)
          print("em push2his bj920029:", r.status_code, r.text[:200])
          # sina BSE
          h2 = {"User-Agent": "Mozilla/5.0", "Referer": "https://finance.sina.com.cn/"}
          r2 = requests.get("https://hq.sinajs.cn/list=bj920029", headers=h2, timeout=15)
          print("sina bj920029:", r2.status_code, r2.text[:150])
          # sina A股 kline (for reference)
          r3 = requests.get("https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData",
              params={"symbol": "sh600519", "scale": "240", "ma": "no", "datalen": "30"}, headers=h2, timeout=15)
          print("sina kline sh600519:", r3.status_code, r3.text[:150])
          EOF
