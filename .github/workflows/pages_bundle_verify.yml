name: Pages bundle verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bundle contains supabase project
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          HTML=$(curl -sS --max-time 20 "$BASE/")
          ASSET=$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.js' | head -1)
          echo "asset: $ASSET"
          curl -sS --max-time 30 "$BASE$ASSET" -o /tmp/main.js
          echo "size: $(wc -c < /tmp/main.js)"
          if grep -q "bcinicwuzppeeyusoimj" /tmp/main.js; then echo "SUPABASE_URL_PRESENT"; else echo "SUPABASE_URL_MISSING"; fi
