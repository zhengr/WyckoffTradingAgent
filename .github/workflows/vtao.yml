name: Verify taoktao from runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: chat completion
        env:
          K: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl -sS --max-time 30 -X POST https://api.taoktao.com/v1/chat/completions \
            -H "Authorization: Bearer $K" -H 'Content-Type: application/json' \
            -d '{"model":"Gemini","messages":[{"role":"user","content":"reply OK only"}],"max_tokens":10}' \
            -o /tmp/r.json -w 'status=%{http_code}\n'
          head -c 300 /tmp/r.json; echo
