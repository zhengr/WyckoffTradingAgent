name: Worker env check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check auth endpoints return 401 not 500
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          echo "--- /api/settings (no token) ---"
          curl -sS -o /tmp/r1 -w 'status=%{http_code}\n' --max-time 25 "$BASE/api/settings"
          cat /tmp/r1 | head -c 200; echo
          echo "--- /api/portfolio (fake token) ---"
          curl -sS -o /tmp/r2 -w 'status=%{http_code}\n' --max-time 25 -H 'Authorization: Bearer fake.jwt.token' "$BASE/api/portfolio"
          cat /tmp/r2 | head -c 200; echo
          echo "--- /api/health ---"
          curl -sS --max-time 25 "$BASE/api/health"; echo
