name: Find kline chunk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List and grep kline chunk on live site
        run: |
          BASE=https://wyckoff-analysis-dyj.pages.dev
          # vite manifest 可能暴露
          curl -sS --max-time 20 "$BASE/manifest.json" -o /tmp/man.json -w 'manifest=%{http_code}\n' || true
          # 暴力：从 analysis 页面的 html 引用 + 动态 chunk 名通常在主 bundle 的 import map 里
          curl -sS --max-time 20 "$BASE/assets/index-Co_iG_75.js" -o /tmp/main.js
          echo "chunk names referenced in main bundle:"
          grep -oE 'kline-[A-Za-z0-9_-]+\.js' /tmp/main.js | sort -u | head
          for c in $(grep -oE 'kline-[A-Za-z0-9_-]+\.js' /tmp/main.js | sort -u); do
            curl -sS --max-time 30 "$BASE/assets/$c" -o /tmp/kc.js -w "chunk=$c status=%{http_code}\n"
            echo "  /api/kline count in $c: $(grep -c '/api/kline' /tmp/kc.js)"
            echo "  fetchKlineViaServerApi count: $(grep -c 'fetchKlineViaServerApi' /tmp/kc.js)"
          done
